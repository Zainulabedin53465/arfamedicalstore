<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030814" />

  <title>ARFA Medical Store | Medical &amp; Healthcare Products in Talbarai</title>
  <meta name="description" content="ARFA Medical Store, Talbarai 754135. Browse medical and healthcare products and place your order easily through WhatsApp." />
  <meta name="keywords" content="medical store, pharmacy, medicine shop, healthcare products, first aid, baby care, vitamins, Talbarai, ARFA Medical Store, order medicine on WhatsApp" />
  <meta name="author" content="ARFA Medical Store" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ARFA Medical Store" />
  <meta property="og:title" content="ARFA Medical Store | Your Health. Our Priority." />
  <meta property="og:description" content="Medical and healthcare products with easy WhatsApp ordering. Talbarai 754135, near Venketswar School." />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="ARFA Medical Store" />
  <meta name="twitter:description" content="Medical and healthcare products with easy WhatsApp ordering." />
  <!-- TODO after deploying: add og:url and og:image with your real site URL -->

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Local business structured data: only verified details (name, phone, address) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Pharmacy",
    "name": "ARFA Medical Store",
    "telephone": "+917205833972",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Near Venketswar School",
      "addressLocality": "Talbarai",
      "postalCode": "754135",
      "addressCountry": "IN"
    }
  }
  </script>
</head>

<body>
  <a class="skip-link" href="#scene-categories">Skip to products</a>

  <!-- Loader (removed by main.js when ready) -->
  <div id="loader" role="status" aria-live="polite">
    <div class="loader__cross" aria-hidden="true"></div>
    <p class="loader__text">ARFA MEDICAL STORE</p>
  </div>

  <!-- Navigation (rendered by components/navigation.js) -->
  <header id="site-nav" class="nav"></header>

  <main id="main">

    <!-- SCENE 01 — CINEMATIC INTRO -->
    <section id="scene-hero" class="scene scene--hero" aria-label="Cinematic introduction">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero__vignette" aria-hidden="true"></div>
      <div class="hero__content">
        <p class="eyebrow">Talbarai &middot; Medical &amp; Healthcare</p>
        <h1 class="hero__title" aria-label="ARFA MEDICAL STORE">
          <span class="hero__word" aria-hidden="true">ARFA</span>
          <span class="hero__word" aria-hidden="true">MEDICAL</span>
          <span class="hero__word" aria-hidden="true">STORE</span>
        </h1>
        <p class="hero__tagline">Your Health. Our Priority.</p>
        <p class="hero__sub">Premium medical and healthcare products. Order easily on WhatsApp.</p>
        <a href="#scene-categories" class="btn btn--primary btn--pulse" id="enter-store">ENTER STORE</a>
      </div>
      <div class="hero__scroll" aria-hidden="true"><span></span></div>
    </section>

    <!-- SCENE 02 — FUTURE OF HEALTHCARE (components/sections.js) -->
    <section id="scene-future" class="scene scene--future" aria-labelledby="future-title"></section>

    <!-- SCENE 03 — EXPLORE OUR PRODUCTS (components/sections.js) -->
    <section id="scene-categories" class="scene scene--categories" aria-labelledby="categories-title"></section>

    <!-- SCENE 04 — MEDICINE COLLECTION (components/catalog.js) -->
    <section id="scene-products" class="scene scene--products" aria-labelledby="products-title"></section>

    <!-- SCENE 05 — WHY CHOOSE US (components/sections.js) -->
    <section id="scene-why" class="scene scene--why" aria-labelledby="why-title"></section>

    <!-- SCENE 06 — SHOPPING CART (components/cart.js) -->
    <section id="scene-cart" class="scene scene--cart" aria-labelledby="cart-title"></section>

    <!-- SCENE 07 — WHATSAPP ORDER (components/checkout.js) -->
    <section id="scene-checkout" class="scene scene--checkout" aria-labelledby="checkout-title"></section>

    <!-- SCENE 08 — STORE LOCATION (components/location.js) -->
    <section id="scene-location" class="scene scene--location" aria-labelledby="location-title"></section>

  </main>

  <!-- SCENE 09 — FOOTER (components/footer.js) -->
  <footer id="site-footer" class="footer"></footer>

  <noscript>
    <p style="padding:2rem;color:#fff;background:#030814;text-align:center">
      ARFA Medical Store: please enable JavaScript to browse products.
      To order, WhatsApp us on +91 72058 33972.
    </p>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
